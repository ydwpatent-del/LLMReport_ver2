name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master
      - main

env:
  PROJECT_ID: gen-lang-client-0716793801
  REGION: asia-northeast3
  SERVICE_NAME: llm-wiki

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Core Tests
        run: |
          pytest tests/test_server.py tests/test_gdrive_storage.py tests/test_ingest_agent.py -v

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 시크릿으로부터 gdrive_credentials.json 파일을 복원하여 Docker 빌드에 안전하게 포함
      - name: Restore Google Drive Credentials File
        env:
          CREDS: ${{ secrets.GDRIVE_CREDENTIALS_JSON || secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$CREDS" ]; then
            printf '%s' "$CREDS" > gdrive_credentials.json
            echo "Successfully restored gdrive_credentials.json from Secret."
          else
            echo "Warning: No credentials secret found. Proceeding without file."
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars STORAGE_MODE=gdrive,WIKI_ACCESS_PIN=${{ secrets.WIKI_ACCESS_PIN }},GDRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID }},GDRIVE_CREDENTIALS_PATH=gdrive_credentials.json,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
